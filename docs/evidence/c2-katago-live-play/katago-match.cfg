# KataGo config for weizigo match on small boards
# modelFile passed via command-line -model flag

# Logging
logDir = untracked/katago-logs
logAllGTPCommunication = true
logSearchInfo = true
logSearchInfoForChosenMove = true
logToStderr = true
startupPrintMessageToStderr = true

# Rules: Tromp-Taylor (area scoring, positional superko) — closest to weizigo
rules = tromp-taylor

# Light search for a fair match against a perfect oracle
maxVisits = 2000
numSearchThreads = 2
ponderingEnabled = false

# Root settings — deterministic play at zero temp
chosenMoveTemperature = 0
chosenMoveTemperatureEarly = 0

# Don't resign — play to completion for accurate scoring
allowResignation = false
resignThreshold = -0.99
resignConsecTurns = 10

# Disable handicap adjustment
dynamicPlayoutDoublingAdvantageCapPerOppLead = 0
